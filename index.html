<!DOCTYPE html>
<!-- Generated by Trae Work -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命理排盘首页 · 八字 / 六爻</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ==================== Design Tokens ==================== */
        :root {
            /* Backgrounds */
            --bg-deep: #0a0a0f;
            --bg-deeper: #050506;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --bg-glass: rgba(10, 10, 15, 0.65);
            --bg-glass-hover: rgba(201, 169, 110, 0.08);

            /* Gold Palette */
            --gold: #c9a96e;
            --gold-light: #e8d5b0;
            --gold-bright: #f0e0c0;
            --gold-dim: #8a7a5a;
            --gold-faint: rgba(201, 169, 110, 0.055);

            /* Text */
            --text-primary: #f5efe5;
            --text-secondary: #b8afa2;
            --text-muted: #766f66;

            /* Accent */
            --red: #c45c4a;
            --red-glow: rgba(196, 92, 74, 0.25);

            /* Borders */
            --border: rgba(201, 169, 110, 0.18);
            --border-hover: rgba(201, 169, 110, 0.38);
            --border-glow: rgba(201, 169, 110, 0.08);

            /* Effects */
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --shadow-card: 0 24px 80px rgba(0, 0, 0, 0.5), 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 32px 100px rgba(0, 0, 0, 0.6), 0 8px 30px rgba(201, 169, 110, 0.08);
            --blur-glass: 20px;
            --blur-heavy: 30px;

            /* Typography */
            --font-serif: "Noto Serif SC", "STSong", "SimSun", "Songti SC", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;

            /* Spacing */
            --topbar-h: 60px;
            --topbar-h-mobile: 50px;
        }

        /* ==================== Reset & Base ==================== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deeper) 100%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ==================== Ambient Background ==================== */
        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(201, 169, 110, 0.08), transparent 70%);
            animation: ambientDrift1 20s ease-in-out infinite;
        }

        .ambient::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -15%;
            width: 55%;
            height: 55%;
            background: radial-gradient(ellipse, rgba(196, 92, 74, 0.06), transparent 70%);
            animation: ambientDrift2 25s ease-in-out infinite;
        }

        @keyframes ambientDrift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 8%) scale(1.1); }
        }

        @keyframes ambientDrift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-6%, -5%) scale(1.15); }
        }

        /* Subtle texture overlay */
        .texture {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.025;
            background-image:
                linear-gradient(45deg, var(--gold) 25%, transparent 25%),
                linear-gradient(-45deg, var(--gold) 25%, transparent 25%);
            background-size: 72px 72px;
        }

        /* ==================== Fixed Back Button ==================== */
        .home-back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 50;
            height: 38px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-glass);
            color: var(--gold-light);
            font-size: 13px;
            font-family: var(--font-sans);
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(var(--blur-glass));
            -webkit-backdrop-filter: blur(var(--blur-glass));
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .home-back-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-glass-hover);
            transform: translateX(-3px);
            box-shadow: 0 6px 24px rgba(201, 169, 110, 0.12);
        }

        /* ==================== Home View ==================== */
        .home {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px 48px;
        }

        .home-inner {
            width: min(980px, 100%);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== Hero Section ==================== */
        .hero {
            position: relative;
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: 48px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-glow);
        }

        .hero-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            filter: brightness(0.7) saturate(1.2);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(10, 10, 15, 0.15) 0%,
                rgba(10, 10, 15, 0.5) 50%,
                rgba(10, 10, 15, 0.95) 100%
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(40px, 7vw, 64px);
            font-weight: 900;
            letter-spacing: 14px;
            color: var(--gold-bright);
            text-shadow: 0 2px 40px rgba(201, 169, 110, 0.3);
            margin-bottom: 12px;
            animation: titleGlow 4s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 2px 40px rgba(201, 169, 110, 0.2); }
            to { text-shadow: 0 2px 60px rgba(201, 169, 110, 0.4), 0 0 120px rgba(201, 169, 110, 0.1); }
        }

        .hero-subtitle {
            font-size: clamp(13px, 2.5vw, 15px);
            letter-spacing: 6px;
            color: var(--gold-dim);
            text-align: center;
        }

        .hero-badge {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            font-size: 12px;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .hero-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 14px rgba(201, 169, 110, 0.9), 0 0 4px var(--gold);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        /* Decorative divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .divider-line {
            flex: 1;
            max-width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .divider-diamond {
            width: 8px;
            height: 8px;
            border: 1px solid var(--gold-dim);
            transform: rotate(45deg);
            opacity: 0.6;
        }

        /* ==================== Entry Cards ==================== */
        .entry-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .entry-card {
            position: relative;
            overflow: hidden;
            min-height: 280px;
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
                var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            backdrop-filter: blur(var(--blur-glass));
            -webkit-backdrop-filter: blur(var(--blur-glass));
            transition:
                transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.4s ease,
                background 0.4s ease,
                box-shadow 0.4s ease;
            animation: cardReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .entry-card:nth-child(1) { animation-delay: 0.15s; }
        .entry-card:nth-child(2) { animation-delay: 0.3s; }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .entry-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--border-hover);
            background:
                linear-gradient(145deg, rgba(201, 169, 110, 0.1), rgba(255, 255, 255, 0.02)),
                var(--bg-card-hover);
            box-shadow: var(--shadow-card-hover);
        }

        /* Watermark character */
        .entry-card::after {
            content: attr(data-mark);
            position: absolute;
            right: -12px;
            bottom: -30px;
            font-family: var(--font-serif);
            font-size: 140px;
            font-weight: 900;
            color: var(--gold-faint);
            line-height: 1;
            pointer-events: none;
            transition: color 0.4s ease, transform 0.4s ease;
        }

        .entry-card:hover::after {
            color: rgba(201, 169, 110, 0.09);
            transform: scale(1.05);
        }

        /* Shimmer effect on hover */
        .entry-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(201, 169, 110, 0.04),
                transparent
            );
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .entry-card:hover::before {
            left: 100%;
        }

        .entry-kicker {
            color: var(--gold);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 14px;
            opacity: 0.85;
        }

        .entry-title {
            font-family: var(--font-serif);
            font-size: clamp(30px, 4vw, 38px);
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 5px;
            margin-bottom: 16px;
            transition: color 0.3s ease;
        }

        .entry-card:hover .entry-title {
            color: var(--gold-bright);
        }

        .entry-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 2;
            max-width: 380px;
            margin-bottom: 28px;
        }

        .entry-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 42px;
            padding: 0 22px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: #1b1308;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 20px rgba(201, 169, 110, 0.25);
            transition: all 0.3s ease;
        }

        .entry-button::after {
            content: '\2192';
            font-size: 15px;
            transition: transform 0.3s ease;
        }

        .entry-card:hover .entry-button {
            box-shadow: 0 6px 30px rgba(201, 169, 110, 0.4);
            transform: translateX(2px);
        }

        .entry-card:hover .entry-button::after {
            transform: translateX(3px);
        }

        /* ==================== App Shell (iframe view) ==================== */
        .app-shell {
            display: none;
            min-height: 100vh;
            background: var(--bg-deeper);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--topbar-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(8, 8, 10, 0.92);
            backdrop-filter: blur(var(--blur-glass));
            -webkit-backdrop-filter: blur(var(--blur-glass));
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .module-back-btn,
        .switch-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--gold-light);
            border-radius: 999px;
            height: 36px;
            padding: 0 16px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .module-back-btn {
            display: none;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: #1b1308;
            font-weight: 700;
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 2px 12px rgba(201, 169, 110, 0.2);
        }

        .module-back-btn:hover,
        .switch-btn:hover {
            border-color: var(--border-hover);
            background: rgba(201, 169, 110, 0.12);
        }

        .module-back-btn:hover {
            background: linear-gradient(135deg, #f4dfb8, var(--gold-light));
            box-shadow: 0 4px 20px rgba(201, 169, 110, 0.3);
        }

        .app-title {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        iframe {
            display: block;
            width: 100%;
            height: calc(100dvh - var(--topbar-h));
            border: 0;
            background: var(--bg-deeper);
        }

        /* ==================== Footer ==================== */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px 32px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 2px;
        }

        .footer-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 0 auto 16px;
        }

        /* ==================== Mobile Responsive ==================== */
        @media (max-width: 720px) {
            .home {
                align-items: flex-start;
                padding: 72px 16px 24px;
            }

            .hero {
                margin-bottom: 32px;
                border-radius: var(--radius-lg);
            }

            .hero-img {
                height: 200px;
            }

            .hero-title {
                font-size: 36px;
                letter-spacing: 8px;
            }

            .hero-subtitle {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .hero-badge {
                margin-top: 14px;
                padding: 5px 14px;
                font-size: 11px;
            }

            .home-back-btn {
                top: 10px;
                left: 10px;
                height: 34px;
                padding: 0 12px;
                font-size: 12px;
            }

            .divider { margin-bottom: 28px; }

            .entry-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .entry-card {
                min-height: auto;
                padding: 24px 22px;
                border-radius: var(--radius-md);
            }

            .entry-title {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .entry-desc {
                font-size: 13px;
                line-height: 1.8;
                margin-bottom: 20px;
            }

            .entry-card::after {
                font-size: 100px;
                right: -8px;
                bottom: -22px;
            }

            .entry-button {
                height: 38px;
                padding: 0 18px;
                font-size: 12px;
            }

            .topbar {
                height: var(--topbar-h-mobile);
                padding: 0 12px;
            }

            .app-title {
                font-size: 13px;
                letter-spacing: 0;
            }

            .switch-btn { display: none; }

            iframe {
                height: calc(100dvh - var(--topbar-h-mobile));
            }

            .footer { padding: 28px 16px 24px; }
        }

        /* ==================== Focus & Accessibility ==================== */
        .entry-card:focus-visible,
        .home-back-btn:focus-visible,
        .module-back-btn:focus-visible,
        .switch-btn:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        /* ==================== Selection ==================== */
        ::selection {
            background: rgba(201, 169, 110, 0.3);
            color: var(--gold-bright);
        }
    </style>
</head>
<body>
    <!-- Ambient background effects -->
    <div class="ambient"></div>
    <div class="texture"></div>

    <!-- Fixed back button -->
    <button class="home-back-btn" id="homeBackBtn" onclick="goBackPage()">&#8592; 返回</button>

    <!-- ==================== Home View ==================== -->
    <main class="home" id="home">
        <div class="home-inner">
            <!-- Hero Section with background image -->
            <header class="hero">
                <img class="hero-img" src="assets/hero.jpg" alt="命理排盘主题图" onerror="this.style.display='none'">
                <div class="hero-overlay">
                    <h1 class="hero-title">命理排盘</h1>
                    <p class="hero-subtitle">八字命局分析 &middot; 六爻问事解卦</p>
                    <span class="hero-badge">在线排盘工具 v2.0</span>
                </div>
            </header>

            <!-- Decorative divider -->
            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-diamond"></span>
                <span class="divider-line"></span>
            </div>

            <!-- Entry Cards -->
            <section class="entry-grid">
                <article class="entry-card" data-mark="八" onclick="location.href='bazi-latest.html'" role="button" tabindex="0">
                    <div class="entry-kicker">BAZI PAIPAN</div>
                    <h2 class="entry-title">八字排盘</h2>
                    <p class="entry-desc">输入出生信息生成个人命盘，从五行格局、十神关系与大运流年中了解自身性格、趋势与发展方向。</p>
                    <span class="entry-button">现在打开八字</span>
                </article>

                <article class="entry-card" data-mark="爻" onclick="location.href='liuyao-latest.html'" role="button" tabindex="0">
                    <div class="entry-kicker">LIUYAO PAIPAN</div>
                    <h2 class="entry-title">六爻排盘</h2>
                    <p class="entry-desc">通过在线起卦或手动排卦，查看本卦、变卦、六亲世应与用神分析，辅助判断所问之事。</p>
                    <span class="entry-button">现在打开六爻</span>
                </article>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="homeFooter">
        <div class="footer-divider"></div>
        <p>命理排盘 &middot; 仅供学习参考</p>
    </footer>

    <!-- ==================== App Shell (iframe view) ==================== -->
    <section class="app-shell" id="appShell">
        <div class="topbar">
            <div class="topbar-left">
                <button class="module-back-btn" id="moduleBackBtn" onclick="goHome()">&#8592; 返回首页</button>
                <div class="app-title" id="appTitle">命理排盘</div>
            </div>
            <div class="topbar-actions">
                <button class="switch-btn" onclick="openApp('bazi')">打开八字</button>
                <button class="switch-btn" onclick="openApp('liuyao')">打开六爻</button>
            </div>
        </div>
        <iframe id="appFrame" title="命理排盘模块"></iframe>
    </section>

    <!-- ==================== JavaScript (preserved logic) ==================== -->
    <script>
        const APPS = {
            bazi: {
                title: '八字排盘 · AI命局分析',
                src: 'bazi-latest.html?v=v2'
            },
            liuyao: {
                title: '六爻排盘 · 问事解卦',
                src: 'liuyao-latest.html?v=v2'
            }
        };

        function openApp(type) {
            const app = APPS[type];
            if (!app) return;
            document.getElementById('home').style.display = 'none';
            document.getElementById('homeFooter').style.display = 'none';
            document.getElementById('appShell').style.display = 'block';
            document.getElementById('homeBackBtn').style.display = 'none';
            document.getElementById('moduleBackBtn').style.display = 'none';
            document.getElementById('appTitle').textContent = app.title;
            document.getElementById('appFrame').src = app.src;
            location.hash = type;
        }

        function goHome() {
            document.getElementById('appFrame').src = '';
            document.getElementById('appShell').style.display = 'none';
            document.getElementById('home').style.display = 'flex';
            document.getElementById('homeFooter').style.display = 'block';
            document.getElementById('homeBackBtn').style.display = 'block';
            document.getElementById('moduleBackBtn').style.display = 'none';
            history.replaceState(null, '', location.pathname + location.search);
        }

        function goBackPage() {
            if (window.history.length > 1) {
                window.history.back();
            }
        }

        window.addEventListener('load', () => {
            const type = location.hash.replace('#', '');
            if (APPS[type]) openApp(type);
        });

        document.querySelectorAll('.entry-card').forEach(card => {
            card.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    card.click();
                }
            });
        });
    </script>
</body>
</html>
